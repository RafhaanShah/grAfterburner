# https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
apiVersion: 1

providers:
- name: 'MSI Afterburner'
  folder: ''
  type: file
  disableDeletion: false
  editable: true
  updateIntervalSeconds: 0
  allowUiUpdates: true
  options:
    path: /etc/grafana/provisioning/dashboards
