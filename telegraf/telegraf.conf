# https://docs.influxdata.com/telegraf/v1/configuration/
# https://github.com/influxdata/telegraf/blob/master/cmd/telegraf/agent.conf
# https://github.com/influxdata/telegraf/blob/master/docs/CONFIGURATION.md
[agent]
  interval = "1000ms" # poll frequency
  flush_interval = "1000ms" # push frequency
  round_interval = false # do not round poll time to :00, :01 etc
  collection_jitter = "0s" # no jitter for polling
  flush_jitter = "0s" # no jitter for pushing
  metric_batch_size = 1 # don't batch metrics before pushing
  metric_buffer_limit = 2 # don't care about lost metrics
  omit_hostname = true # remove hostname tag

# https://github.com/influxdata/telegraf/blob/master/plugins/inputs/http/README.md
[[inputs.http]]
  name_override = "msi_afterburner"
  # modify with actual IP or hostname of PC with MSI Afterburner Remote Server
  urls = ["http://192.168.1.123:82/mahm"]
  method = "GET"
  username = "MSIAfterburner"
  password = "PASSWORD" # change as required
  data_format = "xml"
  timeout = "100ms"

  # https://docs.influxdata.com/telegraf/v1/data_formats/input/xml/
  [[inputs.http.xpath]]
    metric_selection = "/HardwareMonitor/HardwareMonitorEntries"

    # fields to collect
    # add / remove as needed
    [inputs.http.xpath.fields]
        framerate = "number(HardwareMonitorEntry[srcName='Framerate']/data)"
        frametime = "number(HardwareMonitorEntry[srcName='Frametime']/data)"
        cpu_usage = "number(HardwareMonitorEntry[srcName='CPU usage']/data)"
        cpu_temp = "number(HardwareMonitorEntry[srcName='CPU temperature']/data)"
        gpu_usage = "number(HardwareMonitorEntry[srcName='GPU usage']/data)"
        gpu_temp = "number(HardwareMonitorEntry[srcName='GPU temperature']/data)"
        cpu_clock = "number(HardwareMonitorEntry[srcName='CPU clock']/data)"
        gpu_clock = "number(HardwareMonitorEntry[srcName='Core clock']/data)"
        gpu_memory_clock = "number(HardwareMonitorEntry[srcName='Memory clock']/data)"
        cpu_power = "number(HardwareMonitorEntry[srcName='CPU power']/data)"
        gpu_power = "number(HardwareMonitorEntry[srcName='Power']/data)"
        gpu_voltage = "number(HardwareMonitorEntry[srcName='GPU voltage']/data)"
        ram = "number(HardwareMonitorEntry[srcName='RAM usage']/data)"
        vram = "number(HardwareMonitorEntry[srcName='Memory usage']/data)"
        fan_rpm = "number(HardwareMonitorEntry[srcName='Fan tachometer']/data)"
        fan_speed = "number(HardwareMonitorEntry[srcName='Fan speed']/data)"
        temp_limit = "number(HardwareMonitorEntry[srcName='Temp limit']/data)"
        power_limit = "number(HardwareMonitorEntry[srcName='Power limit']/data)"
        voltage_limit = "number(HardwareMonitorEntry[srcName='Voltage limit']/data)"
        no_load_limit = "number(HardwareMonitorEntry[srcName='No load limit']/data)"

# this streams data directly to grafana
# https://github.com/influxdata/telegraf/tree/master/plugins/outputs/websocket
# https://grafana.com/tutorials/stream-metrics-from-telegraf-to-grafana/
# https://grafana.com/docs/grafana/latest/setup-grafana/set-up-grafana-live/
[[outputs.websocket]]
  url = "ws://grafterburner-grafana:3000/api/live/push/msi_afterburner"
  data_format = "influx"

# remove this section if long term data is not required
# https://github.com/influxdata/telegraf/tree/master/plugins/outputs/influxdb_v2
[[outputs.influxdb_v2]]
  urls = ["http://grafterburner-victoriametrics:8428"]
  token = "grafterburner-token"
  organization = "grafterburner"
  bucket = "grafterburner"

